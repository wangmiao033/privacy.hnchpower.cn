<body>
<header class="hero"><div><div><h1>扫描件格式</h1><p>上传图片或 PDF，生成类似扫描仪输出的文件；默认保留红色公章，并按页面顺序合并导出 PDF。</p></div><a class="back" href="../../index.html">返回首页</a></div></header>
<main class="main">
<div class="safe"><b>本地处理：</b>文件不会上传服务器。PDF 拆页、扫描效果和文件合成都在当前浏览器完成。</div>
<div class="grid">
<aside class="card panel">
<div class="row"><h2>① 上传文件</h2><span id="count" class="tag">0 页</span></div>
<label id="drop" class="drop" for="file"><span class="plus">＋</span><b>点击上传 / 拖拽文件</b><span>PDF、PNG、JPG、WEBP</span><small>单个文件不超过 50MB，最多 50 页</small></label><input id="file" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/png,image/jpeg,image/webp">
<div class="section"><div class="row"><h2>② 扫描效果</h2></div><div class="modes"><button class="on" data-mode="color"><b>彩色扫描件</b><span>推荐，保留红章</span></button><button data-mode="gray"><b>灰度扫描</b><span>正文灰度，红章可保留</span></button><button data-mode="bw"><b>黑白扫描</b><span>高对比复印效果</span></button><button data-mode="aged"><b>轻微做旧</b><span>暖白纸张留档感</span></button></div>
<div class="range"><label>扫描强度 <output id="sv">28</output></label><input id="strength" type="range" min="0" max="100" value="28"></div><div class="range"><label>文字对比度 <output id="cv">12</output></label><input id="contrast" type="range" min="-20" max="55" value="12"></div><div class="range"><label>去灰底 <output id="bv">18</output></label><input id="background" type="range" min="0" max="60" value="18"></div><label class="check"><input id="keepRed" type="checkbox" checked>保留红色公章（灰度/黑白模式也保留）</label></div>
<div class="section"><div class="row"><h2>③ 导出扫描件</h2></div><label class="field"><span>PDF 文件名</span><input id="outName" value="扫描件" maxlength="80"></label><label class="field"><span>A4 页边距</span><select id="margin"><option value="6">窄边距 6mm</option><option value="10" selected>标准边距 10mm</option><option value="15">宽边距 15mm</option><option value="0">无边距</option></select></label><div class="actions"><button id="pdfBtn" class="btn primary" disabled>下载扫描件 PDF</button><button id="allBtn" class="btn" disabled>生成全部扫描页</button><button id="jpgBtn" class="btn" disabled>导出当前 JPG</button><button id="clearBtn" class="btn">清空</button></div><div id="progress" class="progress hidden"><div><span id="progressText">正在处理</span><b id="percent">0%</b></div><progress id="bar" max="100" value="0"></progress></div><div id="status" class="status">等待上传文件</div></div>
</aside>
<section><div class="card view"><div class="viewhead"><h2 id="title">原文件预览</h2><div class="nav"><button id="prev" disabled>‹</button><span id="indicator">0 / 0</span><button id="next" disabled>›</button></div></div><div class="preview"><div><div class="label"><span>原文件</span><span id="info">-</span></div><div class="stage"><img id="original" class="hidden"><p id="originalEmpty">上传后显示原文件</p></div></div><div><div class="label"><span>扫描件效果</span><span class="red">保留红章</span></div><div class="stage"><img id="result" class="hidden"><p id="resultEmpty">处理后显示扫描件效果</p></div></div></div></div><div id="pagesBox" class="card pages hidden"><div class="row"><h2>文件页列表</h2><span class="tag">点击切换预览</span></div><div id="list" class="list"></div></div></section>
</div></main>

async function processAll(){if(busy||!pages.length)return false;clearTimeout(timer);busy=true;updateButtons();const v=version,s=settings(),todo=pages.filter(p=>!ready(p));let ok=0;try{for(let i=0;i<todo.length;i++){showProgress("正在生成扫描页 "+(i+1)+"/"+todo.length,i,todo.length);setStatus("正在处理："+todo[i].name);await wait();if(await processPage(todo[i],v,s))ok++;showProgress("正在生成扫描页 "+(i+1)+"/"+todo.length,i+1,todo.length)}}finally{busy=false;hideProgress();renderList();updateButtons()}const done=pages.every(ready);setStatus(done?"全部 "+pages.length+" 页已生成，可下载扫描件 PDF":"处理完成：成功 "+ok+" 页");return done}
function cleanName(v){return(String(v||"扫描件").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\.pdf$/i,"")||"扫描件")}function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function buildPdf(){const {PDFDocument}=await getPdfLib(),pdf=await PDFDocument.create(),margin=+el.margin.value*72/25.4;for(const p of pages){const image=await pdf.embedJpg(await p.resultBlob.arrayBuffer()),land=p.resultWidth>p.resultHeight,w=land?841.89:595.28,h=land?595.28:841.89,page=pdf.addPage([w,h]),scale=Math.min((w-2*margin)/p.resultWidth,(h-2*margin)/p.resultHeight),dw=p.resultWidth*scale,dh=p.resultHeight*scale;page.drawImage(image,{x:(w-dw)/2,y:(h-dh)/2,width:dw,height:dh})}return new Blob([await pdf.save()],{type:"application/pdf"})}async function downloadPdf(){if(busy||!pages.length)return;if(!pages.every(ready)&&!await processAll())return;busy=true;updateButtons();try{showProgress("正在合并扫描件 PDF",0,pages.length);setStatus("正在合并 "+pages.length+" 页扫描件…");const blob=await buildPdf(),name=cleanName(el.outName.value)+".pdf";download(blob,name);setStatus("已生成："+name+"（"+size(blob.size)+"）")}catch(e){setStatus(e.message||"PDF 生成失败")}finally{busy=false;hideProgress();updateButtons()}}
function clearAll(){if(busy)return;clearTimeout(timer);pages.forEach(p=>{URL.revokeObjectURL(p.url);releaseResult(p)});pages=[];active=-1;el.file.value="";hideProgress();show();renderList();updateButtons();setStatus("等待上传文件")}
el.file.onchange=()=>addFiles(el.file.files);el.drop.ondragover=e=>{e.preventDefault();if(!el.file.disabled)el.drop.classList.add("drag")};el.drop.ondragleave=()=>el.drop.classList.remove("drag");el.drop.ondrop=e=>{e.preventDefault();el.drop.classList.remove("drag");if(!el.file.disabled)addFiles(e.dataTransfer.files)};document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll(".modes button").forEach(x=>x.classList.toggle("on",x===b));invalidate("扫描模式已更新，正在刷新当前页…")});[el.strength,el.contrast,el.background].forEach(x=>x.oninput=()=>{el.sv.textContent=el.strength.value;el.cv.textContent=el.contrast.value;el.bv.textContent=el.background.value;invalidate("扫描参数已更新，正在刷新当前页…")});el.keepRed.onchange=()=>invalidate("红章设置已更新，正在刷新当前页…");el.prev.onclick=()=>select(active-1);el.next.onclick=()=>select(active+1);el.allBtn.onclick=processAll;el.pdfBtn.onclick=downloadPdf;el.jpgBtn.onclick=()=>{const p=pages[active];if(ready(p)){const name=cleanName(p.name)+"_扫描件.jpg";download(p.resultBlob,name);setStatus("已导出："+name)}};el.clearBtn.onclick=clearAll;clearAll();
</script>
