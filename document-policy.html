<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>隐私协议文档</title>
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="隐私协议文档正式展示页。" />
  <meta property="og:title" content="隐私协议文档" />
  <meta property="og:description" content="隐私协议文档正式展示页。" />
  <meta property="og:type" content="article" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/icons/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/icons/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180" />
  <style>
    * { box-sizing: border-box; }
    html {
      background: #f6f7f9;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }
    body { margin: 0; }
    .doc-shell {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
      visibility: hidden;
    }
    .doc-shell.is-ready {
      visibility: visible;
    }
    .doc-header,
    .doc-article,
    .doc-error {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
    }
    .doc-header {
      margin-bottom: 18px;
      padding: 28px 30px;
    }
    .doc-kicker {
      margin: 0 0 8px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
    }
    .doc-title {
      margin: 0;
      color: #0f172a;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.25;
      letter-spacing: 0;
      word-break: break-word;
    }
    .doc-meta {
      margin: 12px 0 0;
      color: #475569;
      font-size: 14px;
      line-height: 1.7;
    }
    .doc-article {
      padding: 30px;
    }
    .doc-article p,
    .doc-article li {
      font-size: 16px;
      line-height: 1.9;
      color: #111827;
    }
    .doc-article p { margin: 0 0 12px; }
    .doc-article h1,
    .doc-article h2,
    .doc-article h3,
    .doc-article h4 {
      color: #0f172a;
      line-height: 1.35;
      letter-spacing: 0;
    }
    .doc-article table {
      width: 100%;
      margin: 18px 0;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .doc-article th,
    .doc-article td {
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      vertical-align: top;
      font-size: 15px;
      line-height: 1.75;
      word-break: break-word;
    }
    .doc-error {
      padding: 28px 30px;
    }
    .doc-error h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }
    .doc-error p {
      margin: 0 0 8px;
      color: #475569;
      line-height: 1.8;
    }
    @media (max-width: 640px) {
      .doc-shell {
        width: min(100% - 20px, 920px);
        padding: 16px 0 32px;
      }
      .doc-header,
      .doc-article,
      .doc-error {
        padding: 20px 16px;
        border-radius: 10px;
      }
      .doc-article p,
      .doc-article li {
        font-size: 15px;
        line-height: 1.85;
      }
    }
  </style>
  <link rel="stylesheet" href="policy-reader.css" />
  <script src="supabase-config.js"></script>
  <script>
    (function () {
      var sp = new URLSearchParams(window.location.search);
      var id = (sp.get("id") || sp.get("code") || "").trim();
      if (!/^[A-Za-z0-9]{4,16}$/.test(id)) return;
      var cfg = window.SupabaseConfig || {};
      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) return;
      var base = String(cfg.SUPABASE_URL).replace(/\/+$/, "") + "/functions/v1";
      window.__DOC_POLICY_FETCH__ = fetch(
        base + "/get-document-policy-link?id=" + encodeURIComponent(id),
        { headers: { apikey: cfg.SUPABASE_ANON_KEY } }
      )
        .then(function (res) {
          return res.text().then(function (raw) {
            var json = {};
            try { json = raw ? JSON.parse(raw) : {}; } catch (_e) {}
            if (!res.ok) throw new Error((json && json.error) || raw || ("HTTP " + res.status));
            if (!json.data) throw new Error("返回格式错误：data 为空");
            return json.data;
          });
        })
        .catch(function (err) {
          window.__DOC_POLICY_FETCH__ = null;
          throw err;
        });
    })();
  </script>
</head>
<body class="reader-document-page">
  <div id="reader-progress" class="reader-progress" aria-hidden="true"></div>
  <header class="reader-nav" id="page-top">
    <div class="reader-nav-inner">
      <a class="reader-brand" href="index.html" aria-label="HN Tools 首页">
        <img src="assets/icons/favicon.svg" alt="" width="30" height="30">
        HN Tools <span>隐私协议阅读</span>
      </a>
      <div class="reader-actions" aria-label="阅读工具">
        <button id="reader-size-minus" type="button" class="reader-btn" aria-label="缩小字号">A−</button>
        <span id="reader-size-value" class="reader-size-indicator" aria-live="polite">17</span>
        <button id="reader-size-plus" type="button" class="reader-btn" aria-label="放大字号">A+</button>
        <button id="reader-print" type="button" class="reader-btn reader-print-btn">打印 / PDF</button>
      </div>
    </div>
  </header>
  <div class="reader-layout">
    <aside id="reader-toc-aside" class="reader-toc-aside" aria-label="文档目录" hidden>
      <h2>文档目录</h2>
      <nav id="reader-toc-desktop" class="reader-toc-list"></nav>
    </aside>
    <details id="reader-mobile-toc" class="reader-mobile-toc" hidden>
      <summary>查看文档目录</summary>
      <nav id="reader-toc-mobile" class="reader-toc-list" aria-label="手机文档目录"></nav>
    </details>
    <main class="doc-shell">
    <header class="doc-header">
      <p class="doc-kicker">隐私协议文档</p>
      <h1 id="doc-title" class="doc-title"></h1>
      <p id="doc-meta" class="doc-meta"></p>
    </header>
    <article id="doc-article" class="doc-article"></article>
    </main>
  </div>
  <footer class="reader-footer">
    本页内容由协议发布者提供。如需了解个人信息处理方式，请联系协议正文中列明的运营主体。
  </footer>
  <button id="reader-backtop" class="reader-backtop" type="button" aria-label="返回顶部">↑</button>

  <script src="page-visit-log.js"></script>
  <script src="document-policy.js"></script>
  <script src="policy-reader.js"></script>
</body>
</html>
